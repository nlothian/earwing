<text x="320" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">VDD</text>
<text x="346" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">GND</text>
<text x="372" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">SCK</text>
<text x="398" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">WS</text>
<text x="424" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">SD</text>
<text x="450" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">L/R</text>
<line x1="312" y1="468" x2="458" y2="468" stroke="#d0d7de"/>
<text x="385.0" y="496" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Mic 1</text>
<text x="385.0" y="514" font-size="11" text-anchor="middle" fill="#555">INMP441</text>
<text x="385.0" y="540" font-size="12" text-anchor="middle" fill="#111"><tspan font-weight="700">Left</tspan> slot (L/R → <tspan fill="#222222" font-weight="700">GND</tspan>)</text>
<text x="385.0" y="560" font-size="12" text-anchor="middle" fill="#111">SD → <tspan fill="#e36209" font-weight="700">GPIO14</tspan></text>
<rect x="500" y="440" width="170" height="140" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="2"/>
<text x="520" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">VDD</text>
<text x="546" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">GND</text>
