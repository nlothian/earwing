<text x="650" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">L/R</text>
<line x1="512" y1="468" x2="658" y2="468" stroke="#d0d7de"/>
<text x="585.0" y="496" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Mic 2</text>
<text x="585.0" y="514" font-size="11" text-anchor="middle" fill="#555">INMP441</text>
<text x="585.0" y="540" font-size="12" text-anchor="middle" fill="#111"><tspan font-weight="700">Right</tspan> slot (L/R → <tspan fill="#d62828" font-weight="700">3V3</tspan>)</text>
<text x="585.0" y="560" font-size="12" text-anchor="middle" fill="#111">SD → <tspan fill="#e36209" font-weight="700">GPIO14</tspan></text>
<rect x="700" y="440" width="170" height="140" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="2"/>
<text x="720" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">VDD</text>
