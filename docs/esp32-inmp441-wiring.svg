<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="840" viewBox="0 0 1110 840" font-family="Helvetica, Arial, sans-serif">
<title>Freenove FNK0104 to 4× INMP441 microphone wiring</title>
<rect width="1110" height="840" fill="#ffffff"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#111">Freenove FNK0104 (ESP32-S3) → 4× INMP441 microphone wiring</text>
<text x="40" y="62" font-size="13" fill="#555">Two I2S stereo pairs sharing one bit clock (SCK) and word select (WS). Signals on the Expanded IO socket (P3); power from the I2C socket (P4).</text>
<rect x="40" y="80" width="180" height="290" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="2"/>
<text x="54" y="104" font-size="16" font-weight="700" fill="#111">FNK0104</text>
<text x="54" y="120" font-size="11" fill="#555">Freenove ESP32-S3</text>
<rect x="52" y="134" width="162" height="140" rx="5" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="70" y="204" font-size="10" font-weight="700" fill="#57606a" text-anchor="middle" transform="rotate(-90 70 204)">P3 · EXPANDED IO</text>
<rect x="52" y="278" width="162" height="68" rx="5" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="70" y="312" font-size="10" font-weight="700" fill="#57606a" text-anchor="middle" transform="rotate(-90 70 312)">P4 · I2C</text>
<text x="54" y="362" font-size="9.5" fill="#57606a">P4 pins 3–4 (SCL/SDA): leave free</text>
<text x="206" y="154" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 4 · </tspan>GPIO21</text>
<text x="206" y="190" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 3 · </tspan>GPIO14</text>
<text x="206" y="226" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 2 · </tspan>GPIO3</text>
<text x="206" y="262" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 1 · </tspan>GPIO2</text>
<text x="206" y="298" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 2 · </tspan>GND</text>
<text x="206" y="334" font-size="12.5" font-weight="700" text-anchor="end" fill="#111"><tspan font-size="10.5" font-weight="400" fill="#57606a">pin 1 · </tspan>3V3</text>
<line x1="220" y1="150" x2="1024" y2="150" stroke="#1a7f37" stroke-width="3"/>
<text x="230" y="144" font-size="11" font-weight="700" fill="#1a7f37">SD · mics 3+4</text>
<line x1="220" y1="186" x2="624" y2="186" stroke="#e36209" stroke-width="3"/>
<text x="230" y="180" font-size="11" font-weight="700" fill="#e36209">SD · mics 1+2</text>
<line x1="220" y1="222" x2="998" y2="222" stroke="#8250df" stroke-width="3"/>
<text x="230" y="216" font-size="11" font-weight="700" fill="#8250df">WS / LRCLK</text>
<line x1="220" y1="258" x2="972" y2="258" stroke="#1f6feb" stroke-width="3"/>
<text x="230" y="252" font-size="11" font-weight="700" fill="#1f6feb">SCK / BCLK</text>
