<text x="785.0" y="496" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Mic 3</text>
<text x="785.0" y="514" font-size="11" text-anchor="middle" fill="#555">INMP441</text>
<text x="785.0" y="540" font-size="12" text-anchor="middle" fill="#111"><tspan font-weight="700">Left</tspan> slot (L/R → <tspan fill="#222222" font-weight="700">GND</tspan>)</text>
<text x="785.0" y="560" font-size="12" text-anchor="middle" fill="#111">SD → <tspan fill="#1a7f37" font-weight="700">GPIO21</tspan></text>
<rect x="900" y="440" width="170" height="140" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="2"/>
<text x="920" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">VDD</text>
<text x="946" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">GND</text>
<text x="972" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">SCK</text>
<text x="998" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">WS</text>
<text x="1024" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">SD</text>
<text x="1050" y="458" font-size="10" font-weight="700" text-anchor="middle" fill="#333">L/R</text>
<line x1="912" y1="468" x2="1058" y2="468" stroke="#d0d7de"/>
<text x="985.0" y="496" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Mic 4</text>
<text x="985.0" y="514" font-size="11" text-anchor="middle" fill="#555">INMP441</text>
<text x="985.0" y="540" font-size="12" text-anchor="middle" fill="#111"><tspan font-weight="700">Right</tspan> slot (L/R → <tspan fill="#d62828" font-weight="700">3V3</tspan>)</text>
<text x="985.0" y="560" font-size="12" text-anchor="middle" fill="#111">SD → <tspan fill="#1a7f37" font-weight="700">GPIO21</tspan></text>
<text x="40" y="630" font-size="14" font-weight="700" fill="#111">Nets</text>
<line x1="40" y1="652" x2="70" y2="652" stroke="#d62828" stroke-width="4"/>
<text x="82" y="656" font-size="12.5" font-weight="700" fill="#d62828">3V3</text>
<text x="150" y="656" font-size="12.5" fill="#333">P4 pin 1 → VDD of all mics; L/R of Mic 2 and Mic 4</text>
<line x1="40" y1="676" x2="70" y2="676" stroke="#222222" stroke-width="4"/>
<text x="82" y="680" font-size="12.5" font-weight="700" fill="#222222">GND</text>
<text x="150" y="680" font-size="12.5" fill="#333">P4 pin 2 → GND of all mics; L/R of Mic 1 and Mic 3</text>
<line x1="40" y1="700" x2="70" y2="700" stroke="#1f6feb" stroke-width="4"/>
<text x="82" y="704" font-size="12.5" font-weight="700" fill="#1f6feb">GPIO2</text>
<text x="150" y="704" font-size="12.5" fill="#333">P3 pin 1 → SCK (bit clock) of all mics</text>
<line x1="40" y1="724" x2="70" y2="724" stroke="#8250df" stroke-width="4"/>
<text x="82" y="728" font-size="12.5" font-weight="700" fill="#8250df">GPIO3</text>
<text x="150" y="728" font-size="12.5" fill="#333">P3 pin 2 → WS (word select / LRCLK) of all mics</text>
<line x1="40" y1="748" x2="70" y2="748" stroke="#e36209" stroke-width="4"/>
<text x="82" y="752" font-size="12.5" font-weight="700" fill="#e36209">GPIO14</text>
<text x="150" y="752" font-size="12.5" fill="#333">P3 pin 3 → SD of Mic 1 (left) + Mic 2 (right)</text>
<line x1="40" y1="772" x2="70" y2="772" stroke="#1a7f37" stroke-width="4"/>
<text x="82" y="776" font-size="12.5" font-weight="700" fill="#1a7f37">GPIO21</text>
<text x="150" y="776" font-size="12.5" fill="#333">P3 pin 4 → SD of Mic 3 (left) + Mic 4 (right)</text>
<text x="560" y="630" font-size="14" font-weight="700" fill="#111">Notes</text>
<text x="560" y="656" font-size="12.5" fill="#333" xml:space="preserve">• Dot = connection. Wires that cross without a dot are not connected.</text>
<text x="560" y="680" font-size="12.5" fill="#333" xml:space="preserve">• L/R → GND puts a mic in the left I2S slot; L/R → 3V3 puts it in the right slot.</text>
<text x="560" y="704" font-size="12.5" fill="#333" xml:space="preserve">• Power the mics from 3.3 V only — never 5 V (UART socket pin 1 is 5 V).</text>
<text x="560" y="728" font-size="12.5" fill="#333" xml:space="preserve">• GPIO2, GPIO3, GPIO14 and GPIO21 are four separate nets —</text>
<text x="560" y="752" font-size="12.5" fill="#333" xml:space="preserve">   never connect them to each other.</text>
<text x="560" y="776" font-size="12.5" fill="#333" xml:space="preserve">• Pin numbers are from Freenove's schematic; check the</text>
<text x="560" y="800" font-size="12.5" fill="#333" xml:space="preserve">   silkscreen for pin 1. 2.8" board only — other sizes differ.</text>
</svg>
