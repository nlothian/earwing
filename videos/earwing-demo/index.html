<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>EarWing — Cloud-free private transcription</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0b;
        font-family: Inter, "Helvetica Neue", sans-serif;
        color: #f5f5f7;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59"
      data-width="1920"
      data-height="1080"
    >
      <div id="s1-open" class="scene" data-composition-id="s1-open" data-composition-src="compositions/s1-open.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s2-hero" class="scene" data-composition-id="s2-hero" data-composition-src="compositions/s2-hero.html" data-start="5" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s3-array" class="scene" data-composition-id="s3-array" data-composition-src="compositions/s3-array.html" data-start="11" data-duration="8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s4-track" class="scene" data-composition-id="s4-track" data-composition-src="compositions/s4-track.html" data-start="19" data-duration="7" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s5-transcript" class="scene" data-composition-id="s5-transcript" data-composition-src="compositions/s5-transcript.html" data-start="26" data-duration="8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s6-summary" class="scene" data-composition-id="s6-summary" data-composition-src="compositions/s6-summary.html" data-start="34" data-duration="8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s7-ondevice" class="scene" data-composition-id="s7-ondevice" data-composition-src="compositions/s7-ondevice.html" data-start="42" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s8-private" class="scene" data-composition-id="s8-private" data-composition-src="compositions/s8-private.html" data-start="48" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s9-end" class="scene" data-composition-id="s9-end" data-composition-src="compositions/s9-end.html" data-start="53" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div>

      <audio
        id="music-bed"
        src="assets/bgm/track.wav"
        data-start="0"
        data-duration="59"
        data-track-index="10"
        data-volume="0.85"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":1},{"t":55.5,"v":1},{"t":59,"v":0}]}]}'
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
