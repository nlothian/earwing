<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0a0a0b; overflow: hidden; }

          background: radial-gradient(ellipse, rgba(99,224,138,0.10) 0%, rgba(10,10,11,0) 65%); }

      </style>
      <div id="root" data-composition-id="s9-end" data-width="1920" data-height="1080">
        <div id="s9-glow" data-layout-allow-overflow></div>
        <div id="s9-logo"><img src="assets/logo-white.png" alt="EarWing" /></div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s9-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 3, ease: "sine.out" }, 0);
        tl.fromTo("#s9-logo", { opacity: 0, scale: 0.94, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.4, ease: "power3.out" }, 0.3);

        tl.fromTo("#s9-link", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.8);
        tl.to(["#s9-logo", "#s9-tag", "#s9-link", "#s9-glow"], { opacity: 0, duration: 0.9, ease: "sine.in" }, 5.0);
        window.__timelines["s9-end"] = tl;
