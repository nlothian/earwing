<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0a0a0b; overflow: hidden; }
        #s2-photo { position: absolute; left: 190px; top: 250px; width: 1540px; height: 966px; transform-origin: 50% 40%;
          -webkit-mask-image: radial-gradient(ellipse 62% 64% at 50% 52%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 62% 64% at 50% 52%, #000 55%, transparent 100%); }
        #s2-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s2-dark { position: absolute; inset: 0; background: #0a0a0b; }
        #s2-copy { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
        #s2-kicker { font-family: "JetBrains Mono", monospace; font-size: 24px; letter-spacing: 0.32em; color: #63e08a; text-transform: uppercase; }
        #s2-title { margin-top: 18px; font-family: Inter, sans-serif; font-weight: 700; font-size: 120px; line-height: 1; letter-spacing: -0.045em; color: #f5f5f7; }
        #s2-sub { margin-top: 20px; font-family: Inter, sans-serif; font-weight: 400; font-size: 40px; letter-spacing: -0.015em; color: #d2d2d7; }
      </style>
      <div id="root" data-composition-id="s2-hero" data-width="1920" data-height="1080">
        <div id="s2-photo"><img src="assets/device-hero.jpg" alt="EarWing device" /></div>
                <div id="s2-dark"></div>
        <div id="s2-copy">
          <div id="s2-kicker">Introducing</div>
          <div id="s2-title">EarWing</div>
          <div id="s2-sub">Private transcription. No cloud required.</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s2-dark", { opacity: 1 }, { opacity: 0, duration: 1.6, ease: "sine.inOut" }, 0);
        tl.fromTo("#s2-photo", { scale: 1.1, y: 40 }, { scale: 1.0, y: 0, duration: 6, ease: "power2.out" }, 0);
        tl.fromTo("#s2-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.7);
        tl.fromTo("#s2-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 1.0);
        tl.fromTo("#s2-sub", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.out" }, 1.7);
        tl.to("#s2-copy", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, 5.5);
        tl.to("#s2-dark", { opacity: 1, duration: 0.45, ease: "power1.in" }, 5.55);
        window.__timelines["s2-hero"] = tl;
      </script>
    </template>
  </body>
</html>
