<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0a0a0b; overflow: hidden; }
        #s5-copy { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
        #s5-h { font-family: Inter, sans-serif; font-weight: 700; font-size: 96px; letter-spacing: -0.045em; color: #f5f5f7; }
        #s5-sub { margin-top: 14px; font-family: Inter, sans-serif; font-size: 36px; letter-spacing: -0.01em; color: #a1a1a6; }
        #s5-win { position: absolute; left: 160px; top: 320px; width: 1600px; height: 987px; border-radius: 28px; overflow: hidden; background: #ffffff;
          box-shadow: 0 50px 140px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08); }
        #s5-cam { position: absolute; left: 0; top: 0; width: 1600px; height: 987px; transform-origin: 360px 330px; }
        #s5-vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
        #s5-tag { position: absolute; left: 1290px; top: 360px; padding: 14px 24px; border-radius: 999px; background: #1d1d1f;
          font-family: "JetBrains Mono", monospace; font-size: 22px; letter-spacing: 0.08em; color: #f5f5f7; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #s5-tag .s5-g { color: #63e08a; }
      </style>
      <div id="root" data-composition-id="s5-transcript" data-width="1920" data-height="1080">
        <div id="s5-copy">
          <div id="s5-h">Live transcription.</div>
          <div id="s5-sub">Every speaker, labelled as they talk.</div>
        </div>
        <div id="s5-win" data-layout-allow-overflow>
          <div id="s5-cam">
            <video id="s5-vid" class="clip" src="assets/webui.mp4" data-start="0" data-duration="8" data-media-start="60" data-track-index="1" muted playsinline></video>
          </div>
        </div>
        <div id="s5-tag"><span class="s5-g">●</span><span> cloud-free</span></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s5-h", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.15);
        tl.fromTo("#s5-sub", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "sine.out" }, 0.6);
        tl.fromTo("#s5-win", { opacity: 0, y: 220 }, { opacity: 1, y: 0, duration: 1.1, ease: "power4.out" }, 0.3);
        tl.to("#s5-copy", { opacity: 0, y: -60, duration: 0.6, ease: "power2.in" }, 3.4);
        tl.to("#s5-win", { y: -250, duration: 1.4, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#s5-cam", { scale: 1 }, { scale: 1.32, duration: 1.6, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#s5-tag", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 5.0);
        tl.to("#s5-cam", { scale: 1.38, duration: 2.9, ease: "none" }, 5.1);
        tl.to(["#s5-win", "#s5-tag"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 7.6);
        window.__timelines["s5-transcript"] = tl;
      </script>
    </template>
  </body>
</html>
