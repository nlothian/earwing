; gulltoppr firmware — Freenove FNK0104 (ESP32-S3, 16MB quad flash, 8MB octal
; PSRAM, 2.8" 240x320 ILI9341, native USB). Board config mirrors the
; hardware-proven setup in ../../amy-fnk-keyboard (see its FNK0104-BOARD.md).
[platformio]
src_dir = .

[env:fnk0104]
; pioarduino fork = arduino-esp32 3.x (ESP-IDF 5.x); the official espressif32
; platform still ships 2.x, whose legacy I2S driver can't do the master/slave
; pairing the mic capture needs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; src_dir is this directory, so keep the host tests (test/, built with plain
; clang via test/Makefile) and the web app's files (data/) out of the firmware.
build_src_filter = +<*> -<test/> -<data/>
monitor_speed = 115200
; Don't toggle RTS/DTR when opening the monitor: on the S3's USB-Serial/JTAG
; that pattern can reset the chip.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_size = 16MB
; Two 6.25MB OTA slots: plenty of room for the audio pipeline, keeps OTA open.
board_build.partitions = default_16MB.csv
; The transcriber web app (../site) lives on that table's "spiffs" data
; partition (3.375MB) as LittleFS. data/ (the default data_dir, gitignored) is
; filled gzipped by the site's build script; `pio run -t uploadfs` flashes it,
; separately from the firmware.
board_build.filesystem = littlefs
; BOTH keys, or PSRAM silently breaks: the pioarduino libs script picks the
; prebuilt lib variant from build.arduino.memory_type ONLY, and without it
; links quad-PSRAM libs whose probe fails against this board's octal chip.
board_build.memory_type = qio_opi
board_build.arduino.memory_type = qio_opi
; -O2 instead of the core's -Os: the DSP inner loops run ~2x faster, for a
; few KB of flash.
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; Serial = the native USB port (/dev/cu.usbmodem*), not UART0.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI config for the FNK0104's ILI9341 (no User_Setup.h edits).
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
